<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevMobil Projects</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #000000;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
    }
    #project-selector {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 100;
      display: flex;
      gap: 8px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #333333;
      padding: 6px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }
    .project-btn {
      background: transparent;
      border: none;
      color: #999999;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }
    .project-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }
    .project-btn.active {
      color: #000000;
      background: #ffffff;
      font-weight: 600;
    }
  </style>
  <script type="module" src="index.js"></script>
</head>
<body>
  <div id="project-selector">
    <button class="project-btn active" data-project="automaton">Game of Life</button>
    <button class="project-btn" data-project="circles">Circles and Keys</button>
  </div>
  <canvas></canvas>
</body>
</html>
